name: MongoDB vendor verification (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-mongodb:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            integrations/mongodb/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --prefix integrations/mongodb
      - name: Check vendor runtime dependencies
        run: npm audit --prefix integrations/mongodb
      - name: Check targeted FTP dependency compatibility
        run: npm run test:ftp-compat --prefix integrations/mongodb
      - name: Verify actual vendor against a new authenticated local database
        run: npm run verify:mongodb-local
