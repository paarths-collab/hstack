name: Shell lint

on:
  push:
    paths:
      - "setup"
      - "setup-*"
      - "**.sh"
      - ".github/workflows/shellcheck.yml"
  pull_request:
    paths:
      - "setup"
      - "setup-*"
      - "**.sh"
      - ".github/workflows/shellcheck.yml"
  workflow_dispatch:

jobs:
  shellcheck:
    name: ShellCheck + shfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck shfmt

      - name: ShellCheck
        run: |
          # Find *.sh anywhere (includes tests/installer/*.sh), plus the extensionless
          # setup and setup-* scripts at repo root, and the acceptance stub/target scripts
          # (only if it has a bash/sh shebang). Feed via xargs so multi-line
          # file lists work without GITHUB_OUTPUT heredoc gymnastics.
          {
            find . -name "*.sh" -not -path "*/node_modules/*" -not -path "*/.git/*"
            for f in setup setup-* tests/acceptance/stubs/hermes packages/acceptance/target/hstack-target.sh; do
              if [ -f "$f" ] && head -1 "$f" | grep -qE '(bash|sh)'; then echo "$f"; fi
            done
          } | xargs shellcheck --severity=warning

      - name: shfmt (format diff, advisory)
        # Style enforcement — install.sh and setup pre-date this workflow's
        # opinions and use aligned case arms. Report drift for reviewers but
        # don't fail CI; shellcheck above is the enforcing gate.
        continue-on-error: true
        run: |
          # -i 2: 2-space indent  -ci: case-indent  -bn: binary-op on new line
          {
            find . -name "*.sh" -not -path "*/node_modules/*" -not -path "*/.git/*"
            for f in setup setup-* tests/acceptance/stubs/hermes packages/acceptance/target/hstack-target.sh; do
              if [ -f "$f" ] && head -1 "$f" | grep -qE '(bash|sh)'; then echo "$f"; fi
            done
          } | xargs shfmt -i 2 -ci -bn -d
