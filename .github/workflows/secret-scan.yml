name: Secret scan

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so Gitleaks can diff every commit, not just HEAD
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Keep in sync with GITLEAKS_MIN_VER in VERSIONS.txt and local checks.
          GITLEAKS_VERSION: "8.30.1"
          # Individual-owned repositories do not need a GITLEAKS_LICENSE.
