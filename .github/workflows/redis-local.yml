name: Redis vendor verification (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-redis:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install disposable Redis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server redis-tools
      - run: npm ci --ignore-scripts
      - name: Prepare hash-locked official Redis MCP
        run: |
          python -m venv "$RUNNER_TEMP/redis-mcp"
          "$RUNNER_TEMP/redis-mcp/bin/python" -m pip install --require-hashes --only-binary=:all: -r integrations/redis/requirements.lock
      - name: Verify direct and Hstack paths against an isolated local database
        run: HSTACK_REDIS_PYTHON="$RUNNER_TEMP/redis-mcp/bin/python" npm run verify:redis-local
