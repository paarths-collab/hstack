name: Recipe tests

on:
  push:
    paths:
      - "packages/**"
      - "tests/**"
      - "skills/blueprint-*/**"
      - "blueprints/**"
      - "recipes/**"
      - "apps/composer/**"
      - "acceptance/**"
      - "connectors/**"
      - "VERSIONS.txt"
      - "skills/platform-telegram/**"
      - "skills/integration-github/**"
      - "skills/hermes-home/**"
      - "skills/hermes-cron/**"
      - "skills/integration-notion/**"
      - "skills/hermes-model/**"
      - "skills/hermes-deploy/**"
      - "skills/hermes-install/**"
      - "skills/hermes-memory/**"
      - "skills/hermes-update/**"
      - "templates/SKILL.template.md"
      - ".github/workflows/recipe-tests.yml"
  pull_request:
    paths:
      - "packages/**"
      - "tests/**"
      - "skills/blueprint-*/**"
      - "blueprints/**"
      - "recipes/**"
      - "apps/composer/**"
      - "acceptance/**"
      - "connectors/**"
      - "VERSIONS.txt"
      - "skills/platform-telegram/**"
      - "skills/integration-github/**"
      - "skills/hermes-home/**"
      - "skills/hermes-cron/**"
      - "skills/integration-notion/**"
      - "skills/hermes-model/**"
      - "skills/hermes-deploy/**"
      - "skills/hermes-install/**"
      - "skills/hermes-memory/**"
      - "skills/hermes-update/**"
      - "templates/SKILL.template.md"
      - ".github/workflows/recipe-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recipes:
    name: Recipe tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run recipe tests
        run: node --test tests/recipes/

      # Offline: sandbox filesystem + bash test-double `hermes` + golden SSH command fixtures.
      # Docker-gated tests are skipped with an explicit reason unless HSTACK_DOCKER=1.
      - name: Run acceptance tests
        run: node --test tests/acceptance/

      # Real loopback HTTP and disposable local SSH transport; vendor APIs and
      # the exact-version Hermes command surface remain explicit test fixtures.
      - name: Run ready-to-use workflow tests
        run: node --test --test-concurrency=3 tests/founder-brief/

      # Offline: the repaired SKILL.md bash blocks run in one /bin/bash against a simulated VPS (stub ssh, curl,
      # hermes, crontab). Covers the credential gates, rollback, and deploy composition on bash 3.2 (macOS) and 5.x.
      - name: Run skill block tests
        run: node --test tests/skills/

      # Real sshd in a local Docker container (ubuntu runners only; macOS runners have no Docker).
      - name: Run acceptance tests against a Docker sshd target
        if: runner.os == 'Linux'
        env:
          HSTACK_DOCKER: "1"
        run: node --test tests/acceptance/docker/

      - name: Validate sample blueprints
        shell: bash
        run: |
          set -euo pipefail
          for f in blueprints/*.hstack-blueprint.json; do
            python3 skills/blueprint-install/scripts/validate_blueprint.py "$f" --summary
          done
