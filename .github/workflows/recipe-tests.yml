name: Recipe tests

on:
  push:
    paths:
      - "plugin.json"
      - ".agents/plugins/**"
      - ".claude-plugin/**"
      - ".codex-plugin/**"
      - ".cursor-plugin/**"
      - "packages/**"
      - "tests/**"
      - "skills/hermes-*/**"
      - "skills/platform-*/**"
      - "skills/integration-*/**"
      - "skills/blueprint-*/**"
      - "skills/setup-*/**"
      - "templates/**"
      - "blueprints/**"
      - "recipes/**"
      - "apps/composer/**"
      - "connectors/**"
      - "compatibility/**"
      - "VERSIONS.txt"
      - ".github/workflows/recipe-tests.yml"
  pull_request:
    paths:
      - "plugin.json"
      - ".agents/plugins/**"
      - ".claude-plugin/**"
      - ".codex-plugin/**"
      - ".cursor-plugin/**"
      - "packages/**"
      - "tests/**"
      - "skills/hermes-*/**"
      - "skills/platform-*/**"
      - "skills/integration-*/**"
      - "skills/blueprint-*/**"
      - "skills/setup-*/**"
      - "templates/**"
      - "blueprints/**"
      - "recipes/**"
      - "apps/composer/**"
      - "connectors/**"
      - "compatibility/**"
      - "VERSIONS.txt"
      - ".github/workflows/recipe-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recipes:
    name: Recipe tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run recipe tests
        run: node --test tests/recipes/*.mjs

      # Offline: the repaired SKILL.md bash blocks run in one /bin/bash against a simulated VPS (stub ssh, curl,
      # hermes, crontab). Covers the credential gates, rollback, and deploy composition on bash 3.2 (macOS) and 5.x.
      - name: Run skill block tests
        run: node --test --test-concurrency=3 tests/skills/*.test.mjs

      - name: Validate sample blueprints
        shell: bash
        run: |
          set -euo pipefail
          for f in blueprints/*.hstack-blueprint.json; do
            python3 skills/blueprint-install/scripts/validate_blueprint.py "$f" --summary
          done
